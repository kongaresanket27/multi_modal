name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/real-ingestion-pipeline]

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Run deterministic retrieval and refusal benchmark
        run: npm run evaluate:retrieval
      - name: Run multi-session simulated learner evaluation
        run: npm run evaluate:personalization
      - name: Build production frontend
        run: npm run build
      - name: Upload retrieval benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studypilot-evaluation-results
          path: |
            evaluation/retrieval-benchmark-results.json
            evaluation/simulated-student-results.json
          if-no-files-found: ignore
